version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sustainable_ai_db
    environment:
      POSTGRES_USER: sustainable_ai_user
      POSTGRES_PASSWORD: sustainable_ai_password
      POSTGRES_DB: sustainable_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - sustainable_ai_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sustainable_ai_user -d sustainable_ai"]
      interval: 30s
      timeout: 10s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sustainable_ai_backend
    environment:
      DATABASE_URL: postgresql://sustainable_ai_user:sustainable_ai_password@postgres:5432/sustainable_ai
      BACKEND_URL: http://localhost:8000
      SECRET_KEY: your-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MODEL_VERSION: 1.0
      PREDICTION_CONFIDENCE_THRESHOLD: 0.7
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sustainable_ai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        python -c 'import time; import psycopg2;
                  import os;
                  while True:
                    try:
                      conn = psycopg2.connect(os.environ[\"DATABASE_URL\"]);
                      conn.close();
                      break
                    except:
                      time.sleep(2)' &&
        echo 'Database is ready!' &&
        echo 'Seeding database...' &&
        python data/seed_data.py &&
        echo 'Starting server...' &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "

  # React Frontend
  frontend:
    image: node:18-alpine
    container_name: sustainable_ai_frontend
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_MAP_CENTER_LAT: "18.5204"
      VITE_MAP_CENTER_LNG: "73.8567"
      VITE_DEFAULT_ZOOM: "12"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sustainable_ai_network
    command: >
      sh -c "
        if [ ! -d node_modules ]; then
          npm install
        fi &&
        npm run dev
      "

volumes:
  postgres_data:
    driver: local

networks:
  sustainable_ai_network:
    driver: bridge